name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: arm
            arm_ver: '7'
            name: foxyvpn-linux-armv7
          - os: linux
            arch: arm64
            arm_ver: ''
            name: foxyvpn-linux-arm64
          - os: linux
            arch: amd64
            arm_ver: ''
            name: foxyvpn-linux-amd64
          - os: linux
            arch: mipsle
            arm_ver: ''
            gomips: 'softfloat'
            name: foxyvpn-linux-mipsle

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_ver }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ matrix.name }} ./cmd/foxyvpn

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
